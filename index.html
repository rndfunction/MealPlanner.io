<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Planner - Personalized Menu Builder</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <header class="site-header" role="banner">
    <div class="header-content">
      <h1 class="site-title">
        <span class="title-icon" aria-hidden="true">🥗</span>
        Meal Planner
      </h1>
      <p class="site-tagline">Build personalized menus that meet your nutrition goals</p>
    </div>
  </header>

  <main id="main-content" role="main">
    <div id="app">
      <!-- App content rendered by Vue -->
      <div class="loading-container" v-if="!appReady">
        <p>Loading Meal Planner...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>Meal Planner - Nutrition data is estimated and for informational purposes only.</p>
    <p>Always consult with a healthcare provider for medical dietary advice.</p>
  </footer>

  <script src="/js/data/recipes.js"></script>
  <script src="/js/data/ingredients.js"></script>
  <script src="/js/utils/nutrition.js"></script>
  <script src="/js/utils/menuGenerator.js"></script>
  <script src="/js/utils/storage.js"></script>
  <script src="/js/utils/ingredientLookup.js"></script>
  <script src="/js/utils/usdaClient.js"></script>
  <script src="/js/components/preferences-form.js"></script>
  <script src="/js/components/menu-display.js"></script>
  <script src="/js/components/nutrition-summary.js"></script>
  <script src="/js/components/shopping-list.js"></script>
  <script src="/js/components/custom-recipe-form.js"></script>
  <script src="/js/components/recipe-manager.js"></script>
  <script src="/js/components/settings-panel.js"></script>
  <script src="/js/components/recipe-picker-modal.js"></script>
  <script src="/js/components/log-food-modal.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
